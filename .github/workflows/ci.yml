name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Recompute committed research evidence
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Install locked CPU-only development environment
        run: uv sync --extra dev --frozen

      - name: Verify frozen protocol
        run: >-
          uv run pytest tests/test_protocol_lock.py::test_real_protocol_lock_still_holds
          -q -p no:cacheprovider -o addopts=

      - name: Recompute headline metrics from committed raw records
        run: uv run python scripts/verify_results.py --dry-run

      - name: Verify development and locked split isolation
        run: uv run python scripts/check_leakage.py

      - name: Compare recomputed gates with committed NO-GO
        run: uv run python scripts/verify_evidence.py

  quality:
    name: Python quality checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy src scripts
