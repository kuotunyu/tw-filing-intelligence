[project]
name = "tw-filing-intelligence"
version = "0.1.0"
description = "Feasibility study: multimodal filing intelligence over Taiwan public company disclosures (MOPS / TWSE OpenAPI / XBRL). Not investment advice. Not a production system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "kuotunyu" }]

dependencies = [
    # --- config / typing ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # --- io ---
    "httpx>=0.27",
    # --- pdf parsing ---
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    # --- structured numeric ---
    "duckdb>=1.0",
    # --- retrieval ---
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Heavy GPU/model deps are kept out of the default install so that tests and
# data work stay CPU-only and offline.
models = [
    "torch>=2.3",
    "transformers>=4.51",
    "sentence-transformers>=3.0",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twfi"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",
    "ANN",              # annotations
    "S",                # bandit-ish security
    "PTH",              # use pathlib
]
ignore = [
    "ANN401",  # allow Any where genuinely needed
    "S101",    # assert is fine in tests
    # This project documents itself in Traditional Chinese; full-width punctuation
    # inside docstrings and messages is intentional, not a homoglyph attack.
    "RUF001",
    "RUF002",
    "RUF003",
    # __all__ is grouped by subsystem (io / parsing / numeric / evaluation) on
    # purpose so the error taxonomy stays readable; alphabetical order would hide it.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001", "S311"]
"scripts/**" = ["S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pdfplumber.*", "duckdb.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--cov=twfi",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "gpu: requires a GPU (deselected by default)",
    "network: requires network access (deselected by default)",
]

[tool.coverage.run]
source = ["src/twfi"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
