# Declared structured datasets for the numeric route.
#
# Endpoint choices come from docs/reference/twse_openapi_endpoints.md, which is
# generated from the official API description (143 endpoints discovered).
#
# IMPORTANT FINDING (P1, recorded in docs/DATA_PROVENANCE.md 8):
# every /opendata/ financial-statement endpoint is a SINGLE-PERIOD SNAPSHOT.
# `scripts/sample_endpoint.py /opendata/t187ap06_L_ci` returned 1045 rows all
# carrying 年度=115 季別=1. The 年度/季別 columns exist but hold one value, so the
# OpenAPI cannot supply FY2023/FY2024. It is therefore used for:
#   (a) company metadata,
#   (b) the current period, which is genuinely useful as an independent source for
#       cross_document questions and for conflict detection against the PDFs.
# Historical structured values come from XBRL (manual placement) or from verified
# table extraction; see DECISIONS D-010.
#
# Note the two schema families: 一般業 (_ci, 26 balance-sheet columns) and
# 金控業 (_fh, 60 columns). 2882 needs the _fh endpoints. That divergence is
# exactly the hard case the study kept on purpose.
version: 1

datasets:
  # ------------------------------------------------- S3 TWSE OpenAPI (automated)
  - dataset_id: twse-openapi-swagger
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/swagger.json
    description: Official API description; the provenance root for every endpoint below.
    split: both
    acquisition: pending
    notes: Regenerate docs/reference/twse_openapi_endpoints.md with scripts/explore_sources.py

  - dataset_id: twse-openapi-t187ap03_L
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap03_L
    description: 上市公司基本資料 (company profile; 33 columns). Metadata questions.
    split: both
    acquisition: pending
    notes: ""

  - dataset_id: twse-openapi-t187ap05_L
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap05_L
    description: 上市公司每月營業收入彙總表 (monthly revenue, current month only).
    split: both
    acquisition: pending
    notes: Single-period snapshot; useful as an independent cross-source check.

  - dataset_id: twse-openapi-t187ap06_L_ci
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci
    description: 上市公司綜合損益表(一般業) — 2330 / 2317 / 1301 / 2412.
    split: both
    acquisition: pending
    notes: Verified single-period (年度=115 季別=1, 1045 rows) on 2026-07-30.

  - dataset_id: twse-openapi-t187ap06_L_fh
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap06_L_fh
    description: 上市公司綜合損益表(金控業) — 2882. Different schema from 一般業.
    split: locked
    acquisition: pending
    notes: 金控 uses 利息淨收益 / 保險負債準備淨變動 etc.; no 營業收入 line at all.

  - dataset_id: twse-openapi-t187ap07_L_ci
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap07_L_ci
    description: 上市公司資產負債表(一般業), 26 columns.
    split: both
    acquisition: pending
    notes: ""

  - dataset_id: twse-openapi-t187ap07_L_fh
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap07_L_fh
    description: 上市公司資產負債表(金控業), 60 columns.
    split: locked
    acquisition: pending
    notes: The 26-vs-60 column divergence is the structural hard case for 2882.

  - dataset_id: twse-openapi-t187ap14_L
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap14_L
    description: 上市公司各產業EPS統計資訊 (EPS, 營業利益, 普通股每股面額).
    split: both
    acquisition: pending
    notes: ""

  - dataset_id: twse-openapi-t187ap17_L
    source: S3
    endpoint: https://openapi.twse.com.tw/v1/opendata/t187ap17_L
    description: 上市公司營益分析查詢彙總表 (毛利率, 營業利益率, 營業收入(百萬元)).
    split: both
    acquisition: pending
    notes: >-
      Official ratios. Useful to cross-check ratios the numeric route computes
      itself, and as a unit trap: 營業收入 is in 百萬元 here but 千元 elsewhere.

  # --------------------------------------- S2 MOPS XBRL (manual placement, optional)
  # Recommended but not required. If supplied, historical structured values come
  # from official XBRL; if not, they come from verified table extraction and the
  # report must say so. Either way the provenance is recorded.
  - dataset_id: mops-xbrl-2412-FY2023
    source: S2
    endpoint: https://mops.twse.com.tw/mops/web/t57sb01_q1
    description: 中華電信 FY2023 XBRL financial statements (optional).
    split: dev
    acquisition: pending
    notes: Manual placement -> data/raw/manual/mops-xbrl-2412-FY2023.zip

