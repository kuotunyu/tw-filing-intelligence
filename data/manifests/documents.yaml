# DECLARATION of the filings this study uses. Hand-authored; no script rewrites it.
# What was actually obtained is recorded in data/manifests/acquisition.lock.yaml.
#
# The PDFs themselves are NEVER committed (see .gitignore). This file plus
# scripts/fetch_documents.py is the whole reproduction recipe: download each
# document from `source_page`, save it under data/raw/manual/ with the filename in
# `notes`, and the script records and re-verifies its SHA-256.
#
# Acquisition is MANUAL by protocol decision D-010, not by omission:
#   * mops.twse.com.tw/mops/web/* returns a 65-byte JS bootstrap -- the new MOPS
#     is a single-page app, and its data API is not published, so using it would
#     mean calling an undocumented private endpoint.
#   * doc.twse.com.tw/server-java/t57sb01 is a server-rendered POST form with no
#     CAPTCHA, but its `step` parameter semantics are not published, so driving it
#     is form simulation rather than use of a documented download path.
# Seven documents do not justify either. See docs/DATA_PROVENANCE.md 8.
#
# FORM PATH (read off the real page, then confirmed against the live index -- see 8.3):
#   資料類型 has NO「年報」option, and the dropdowns show only the Chinese names, not
#   the F-codes. The annual report lives under 資料類型「股東會相關資料」→
#   資料細節說明「股東會年報(尚未適用永續揭露準則)」 (code F04).
#
#   Use F04 for FY2023 / FY2024. Empirically confirmed: 2412 + 年度 112 +
#   「股東會年報(適用永續揭露準則)」 (F18) returns 查無所需資料. Taiwan's
#   永續揭露準則 phases in from 2026, so filings for these years are all classified
#   as 尚未適用.
#
#   Do NOT pick 股東會年報(僅永續專章), 特別股股東會年報, or 英文版-股東會年報.
#   資料年度 is a 民國 year (3 digits). 季別/月份 stays empty for 股東會相關資料.
#   Trust the report's cover page (「民國112年度年報」) over the index year: the
#   filename must state the fiscal year the report COVERS.
#
# Protocol reference: docs/FEASIBILITY_PROTOCOL.md 1.2
version: 1

