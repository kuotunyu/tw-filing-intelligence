# Declared filings for the feasibility study.
#
# The PDFs themselves are NEVER committed (see .gitignore). This file plus
# scripts/fetch_documents.py is the whole reproduction recipe: a reader downloads
# each document from `source_page`, drops it in data/raw/manual/, and the script
# verifies the SHA-256 recorded here.
#
# Acquisition is MANUAL by protocol decision D-010, not by omission:
#   * mops.twse.com.tw/mops/web/* returns a 65-byte JS bootstrap -- the new MOPS
#     is a single-page app, and its data API is not published, so using it would
#     mean calling an undocumented private endpoint.
#   * doc.twse.com.tw/server-java/t57sb01 is a server-rendered POST form with no
#     CAPTCHA, but its `step` parameter semantics are not published, so driving it
#     is form simulation rather than use of a documented download path.
# Seven documents do not justify either. See docs/DATA_PROVENANCE.md 8.
#
# Protocol reference: docs/FEASIBILITY_PROTOCOL.md 1.2
