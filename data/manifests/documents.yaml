    source_page: https://doc.twse.com.tw/server-java/t57sb01
    notes: >-
      代號 2412 / 資料年度 112 / 資料類型「F 股東會相關資料」/ 細節「股東會年報(尚未適用永續揭露準則)」.
      封面須為「民國112年度年報」.
